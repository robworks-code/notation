name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # The gate itself lives in scripts/verify.sh and is what a human runs.
    # This workflow exists for the two things a single Mac cannot prove:
    # that the core still runs on Linux, and that it still runs on the
    # Python versions users actually have. It must never grow checks of
    # its own - if something is worth checking, it goes in verify.sh.
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 is the floor: macOS ships 3.9.6 and the core must not use
          # syntax past it. Nothing but this job mechanically enforces that.
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          # One non-Linux runner, so a POSIX-but-not-Linux regression shows up.
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install zsh
        # Not a convenience: the backup-listing recipe exists to avoid zsh's
        # nomatch abort, so the test that proves it must run under a real zsh.
        # macOS runners already ship one.
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh

      - name: Confirm the interpreter under test
        run: python3 -VV

      - name: Run the gate
        run: ./scripts/verify.sh
